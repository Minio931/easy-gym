spring:
  application:
    name: easy-gym-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/easy_gym}
    username: ${DB_USERNAME:easy_gym}
    password: ${DB_PASSWORD:easy_gym}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # Only health -- the rest of actuator (env, beans, ...) is a configuration leak.
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # Database-only signal for the wojtur.ovh dashboard -- no `show-details`,
        # so /actuator/health/database only returns {"status":"UP"|"DOWN"}, same
        # as the rest of actuator, zero leakage beyond that. The group name MUST
        # differ from "db" -- that is the name of the built-in indicator, a clash
        # breaks startup (IllegalStateException: HealthContributor "db" clashes).
        database:
          include: db

app:
  jwt:
    # The dev value below is deliberately weak -- in production JWT_SECRET must
    # be set (min. 32 random bytes), otherwise JWT signatures are forgeable.
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-1234567890}
    issuer: easy-gym-backend
    access-token-ttl: 15m
    refresh-token-ttl: 30d

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  admin:
    # Sekret do POST /api/admin/users (patrz AdminUserService) -- w produkcji
    # a real random secret is REQUIRED; the dev default below is deliberately weak.
    bootstrap-secret: ${ADMIN_BOOTSTRAP_SECRET:dev-only-bootstrap-secret-change-me}
