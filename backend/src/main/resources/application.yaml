spring:
  application:
    name: easy-gym-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/easy_gym}
    username: ${DB_USERNAME:easy_gym}
    password: ${DB_PASSWORD:easy_gym}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # Wartość developerska poniżej celowo słaba -- w produkcji JWT_SECRET musi być
    # ustawiony (min. 32 losowe bajty), inaczej podpisy JWT są do podrobienia.
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-1234567890}
    issuer: easy-gym-backend
    access-token-ttl: 15m
    refresh-token-ttl: 30d

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
