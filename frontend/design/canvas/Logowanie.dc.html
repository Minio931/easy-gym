<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,400..800&family=Public+Sans:wght@400..700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #46D5E0; } a:hover { color: #8AE6ED; }
    .app {
      --bg:#0E0F11; --surface:#16181B; --surface-2:#1F2227; --surface-3:#2A2E34;
      --hairline:rgba(255,255,255,.09); --ink:#F3F2EE; --ink-2:#B9BCC0; --ink-3:#80858C;
      --cta:#F3F2EE; --cta-ink:#0E0F11; --accent:#46D5E0; --accent-ink:#06191C;
      --pr:#F0B429; --pr-wash:rgba(240,180,41,.12);
      font-family:"Public Sans",system-ui,sans-serif; font-size:16px; line-height:1.5;
    }
    .app.light {
      --bg:#FAFAF8; --surface:#FFFFFF; --surface-2:#F1F1EE; --surface-3:#E4E4E0;
      --hairline:rgba(16,17,20,.10); --ink:#101114; --ink-2:#4A4E55; --ink-3:#767B83;
      --cta:#101114; --cta-ink:#FAFAF8; --accent:#0E8697; --accent-ink:#FFFFFF;
      --pr:#B07607; --pr-wash:rgba(176,118,7,.10);
    }
    .num { font-family:"Archivo",system-ui,sans-serif; font-variant-numeric:tabular-nums;
           font-variation-settings:"wdth" 90; font-weight:600; letter-spacing:-.01em; }
    .num-lg { font-size:30px; line-height:32px; font-weight:700; font-variation-settings:"wdth" 88; }
    .label { font-size:13px; line-height:16px; font-weight:600; letter-spacing:.06em;
             text-transform:uppercase; color:var(--ink-3); }
    .meta { font-size:12px; line-height:16px; color:var(--ink-3); }
  </style>
</helmet>
<div class="app {{theme}}" style="width:390px; height:844px; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; justify-content:center; padding:0 16px; box-sizing:border-box">

  <p class="label" style="margin:0">easy-gym</p>
  <h1 class="num num-lg" style="margin:8px 0 0; color:var(--ink)">Zaloguj się</h1>

  <div style="display:flex; flex-direction:column; gap:16px; margin-top:32px">

    <div style="display:flex; flex-direction:column; gap:8px">
      <label class="label" style="margin:0">Login</label>
      <div style="height:48px; border-radius:10px; border:1px solid var(--hairline); background:var(--surface-2); display:flex; align-items:center; padding:0 16px; color:var(--ink)">Minio</div>
    </div>

    <div style="display:flex; flex-direction:column; gap:8px">
      <label class="label" style="margin:0">Hasło</label>
      <div style="height:48px; border-radius:10px; border:2px solid var(--accent); background:var(--surface-2); display:flex; align-items:center; padding:0 15px; letter-spacing:.3em; color:var(--ink-2)">••••••••</div>
    </div>

    <button style="height:48px; border:0; border-radius:10px; background:var(--cta); color:var(--cta-ink); font:600 16px/1 'Public Sans',system-ui,sans-serif; cursor:pointer">Zaloguj</button>
  </div>

  <p class="meta" style="margin:24px 0 0">Konta zakłada administrator. Nie ma rejestracji ani resetu hasła.</p>
</div>
</x-dc>
<script data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
