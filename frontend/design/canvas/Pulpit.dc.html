<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,400..800&family=Public+Sans:wght@400..700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #46D5E0; } a:hover { color: #8AE6ED; }
    .app {
      --bg:#0E0F11; --surface:#16181B; --surface-2:#1F2227; --surface-3:#2A2E34;
      --hairline:rgba(255,255,255,.09); --ink:#F3F2EE; --ink-2:#B9BCC0; --ink-3:#80858C;
      --cta:#F3F2EE; --cta-ink:#0E0F11; --accent:#46D5E0; --accent-ink:#06191C;
      --pr:#F0B429; --pr-wash:rgba(240,180,41,.12); --good:#0CA30C;
      --s1:#3987E5; --s2:#D95926; --s3:#199E70; --s4:#C98500; --s5:#D55181;
      --chart-grid:rgba(255,255,255,.07);
      font-family:"Public Sans",system-ui,sans-serif; font-size:16px; line-height:1.5;
    }
    .app.light {
      --bg:#FAFAF8; --surface:#FFFFFF; --surface-2:#F1F1EE; --surface-3:#E4E4E0;
      --hairline:rgba(16,17,20,.10); --ink:#101114; --ink-2:#4A4E55; --ink-3:#767B83;
      --cta:#101114; --cta-ink:#FAFAF8; --accent:#0E8697; --accent-ink:#FFFFFF;
      --pr:#B07607; --pr-wash:rgba(176,118,7,.10);
      --s1:#2A78D6; --s2:#EB6834; --s3:#1BAF7A; --s4:#EDA100; --s5:#E87BA4;
      --chart-grid:rgba(16,17,20,.08);
    }
    .num { font-family:"Archivo",system-ui,sans-serif; font-variant-numeric:tabular-nums;
           font-variation-settings:"wdth" 90; font-weight:600; letter-spacing:-.01em; }
    .num-lg { font-size:30px; line-height:32px; font-weight:700; font-variation-settings:"wdth" 88; }
    .title { font-family:"Archivo",system-ui,sans-serif; font-variation-settings:"wdth" 95;
             font-size:20px; line-height:26px; font-weight:650; }
    .label { font-size:13px; line-height:16px; font-weight:600; letter-spacing:.06em;
             text-transform:uppercase; color:var(--ink-3); }
    .meta { font-size:12px; line-height:16px; color:var(--ink-3); }
    .pill { height:32px; padding:0 14px; border-radius:999px; border:1px solid var(--hairline);
            background:var(--surface-2); color:var(--ink-2);
            font:600 13px/1 "Public Sans",system-ui,sans-serif; cursor:pointer; }
    .pill.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
    .bar { width:28px; display:flex; flex-direction:column; justify-content:flex-end; gap:2px;
           border-radius:4px; overflow:hidden; }
    .dot { width:10px; height:10px; border-radius:2px; }
  </style>
</helmet>
<div class="app {{theme}}" style="width:390px; height:844px; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; box-sizing:border-box; overflow:hidden">

  <header style="height:56px; flex:0 0 56px; border-bottom:1px solid var(--hairline); display:flex; align-items:center; padding:0 16px">
    <h1 class="title" style="margin:0; flex:1">Pulpit</h1>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--ink-2)">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M12 2.5v2.2M12 19.3v2.2M4.2 7.3l1.9 1.1M17.9 15.6l1.9 1.1M4.2 16.7l1.9-1.1M17.9 8.4l1.9-1.1"></path>
    </svg>
  </header>

  <div style="flex:1; display:flex; flex-direction:column; gap:16px; padding:16px; box-sizing:border-box; overflow:hidden">

    <div style="display:flex; gap:8px">
      <div style="flex:1; background:var(--surface); border:1px solid var(--hairline); border-radius:14px; padding:12px 14px">
        <p class="num num-lg" style="margin:0">4</p>
        <p class="label" style="margin:6px 0 0; font-size:11px">Treningi / tydzień</p>
      </div>
      <div style="flex:1.4; background:var(--surface); border:1px solid var(--hairline); border-radius:14px; padding:12px 14px">
        <p class="num num-lg" style="margin:0">24 180 <span class="meta" style="font-size:13px">kg</span></p>
        <p class="label" style="margin:6px 0 0; font-size:11px">Objętość · <span style="color:var(--good)">▲ 5.2%</span></p>
      </div>
    </div>

    <div style="background:var(--surface); border:1px solid var(--hairline); border-radius:14px; padding:14px">
      <div style="display:flex; align-items:baseline; gap:8px">
        <p class="label" style="margin:0; flex:1">Objętość tygodniowa</p>
        <p class="num num-lg" style="margin:0">24 180</p>
      </div>

      <div style="display:flex; gap:6px; margin:12px 0 14px">
        <button class="pill">1M</button>
        <button class="pill on">3M</button>
        <button class="pill">6M</button>
        <button class="pill">1R</button>
        <button class="pill">Całość</button>
      </div>

      <!-- Stacked bar: kolor idzie za kubełkiem, nie za pozycją w stosie -->
      <div style="display:flex; gap:8px">
        <div style="width:26px; height:180px; position:relative">
          <span class="meta" style="position:absolute; top:-6px; right:0">30k</span>
          <span class="meta" style="position:absolute; top:54px; right:0">20k</span>
          <span class="meta" style="position:absolute; top:114px; right:0">10k</span>
        </div>
        <div style="flex:1; position:relative; height:180px">
          <div style="position:absolute; inset:0">
            <div style="position:absolute; top:0; left:0; right:0; height:1px; background:var(--chart-grid)"></div>
            <div style="position:absolute; top:60px; left:0; right:0; height:1px; background:var(--chart-grid)"></div>
            <div style="position:absolute; top:120px; left:0; right:0; height:1px; background:var(--chart-grid)"></div>
            <div style="position:absolute; bottom:0; left:0; right:0; height:1px; background:var(--hairline)"></div>
          </div>
          <div style="position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:space-between">
            <div class="bar" style="height:96px"><div style="height:30px; background:var(--s1)"></div><div style="height:26px; background:var(--s2)"></div><div style="height:24px; background:var(--s3)"></div><div style="height:16px; background:var(--s5)"></div></div>
            <div class="bar" style="height:112px"><div style="height:34px; background:var(--s1)"></div><div style="height:30px; background:var(--s2)"></div><div style="height:28px; background:var(--s3)"></div><div style="height:20px; background:var(--s5)"></div></div>
            <div class="bar" style="height:104px"><div style="height:28px; background:var(--s1)"></div><div style="height:28px; background:var(--s2)"></div><div style="height:30px; background:var(--s3)"></div><div style="height:18px; background:var(--s5)"></div></div>
            <div class="bar" style="height:58px"><div style="height:16px; background:var(--s1)"></div><div style="height:14px; background:var(--s2)"></div><div style="height:16px; background:var(--s3)"></div><div style="height:12px; background:var(--s5)"></div></div>
            <div class="bar" style="height:126px"><div style="height:38px; background:var(--s1)"></div><div style="height:32px; background:var(--s2)"></div><div style="height:34px; background:var(--s3)"></div><div style="height:22px; background:var(--s5)"></div></div>
            <div class="bar" style="height:134px"><div style="height:40px; background:var(--s1)"></div><div style="height:34px; background:var(--s2)"></div><div style="height:36px; background:var(--s3)"></div><div style="height:24px; background:var(--s5)"></div></div>
            <div class="bar" style="height:118px"><div style="height:34px; background:var(--s1)"></div><div style="height:30px; background:var(--s2)"></div><div style="height:32px; background:var(--s3)"></div><div style="height:22px; background:var(--s5)"></div></div>
            <div class="bar" style="height:145px"><div style="height:44px; background:var(--s1)"></div><div style="height:36px; background:var(--s2)"></div><div style="height:38px; background:var(--s3)"></div><div style="height:27px; background:var(--s5)"></div></div>
          </div>
        </div>
      </div>

      <div style="display:flex; gap:8px; margin:8px 0 0 34px; justify-content:space-between">
        <span class="meta" style="width:28px; text-align:center">W20</span>
        <span class="meta" style="width:28px; text-align:center">21</span>
        <span class="meta" style="width:28px; text-align:center">22</span>
        <span class="meta" style="width:28px; text-align:center">23</span>
        <span class="meta" style="width:28px; text-align:center">24</span>
        <span class="meta" style="width:28px; text-align:center">25</span>
        <span class="meta" style="width:28px; text-align:center">26</span>
        <span class="meta" style="width:28px; text-align:center">27</span>
      </div>

      <div style="display:flex; flex-wrap:wrap; gap:10px 14px; margin-top:12px">
        <span style="display:flex; align-items:center; gap:6px"><span class="dot" style="background:var(--s1)"></span><span class="meta" style="color:var(--ink-2)">klatka</span></span>
        <span style="display:flex; align-items:center; gap:6px"><span class="dot" style="background:var(--s2)"></span><span class="meta" style="color:var(--ink-2)">plecy</span></span>
        <span style="display:flex; align-items:center; gap:6px"><span class="dot" style="background:var(--s3)"></span><span class="meta" style="color:var(--ink-2)">nogi</span></span>
        <span style="display:flex; align-items:center; gap:6px"><span class="dot" style="background:var(--s5)"></span><span class="meta" style="color:var(--ink-2)">ramiona</span></span>
        <span class="meta" style="margin-left:auto; text-decoration:underline">Tabela</span>
      </div>
    </div>

    <div>
      <p class="label" style="margin:0 0 10px">Ostatnie rekordy</p>
      <div style="background:var(--surface); border:1px solid var(--hairline); border-radius:14px; overflow:hidden">
        <div style="display:flex; align-items:center; gap:10px; padding:11px 14px">
          <span style="color:var(--pr); border:1px solid var(--pr); border-radius:999px; padding:2px 8px; font:700 10px/1.4 'Public Sans',system-ui,sans-serif; letter-spacing:.06em">PR</span>
          <span style="flex:1; font-size:14px">Wyciskanie leżąc</span>
          <span class="num" style="font-size:15px">110 kg × 5</span>
        </div>
        <div style="display:flex; align-items:center; gap:10px; padding:11px 14px; border-top:1px solid var(--hairline)">
          <span style="color:var(--pr); border:1px solid var(--pr); border-radius:999px; padding:2px 8px; font:700 10px/1.4 'Public Sans',system-ui,sans-serif; letter-spacing:.06em">PR</span>
          <span style="flex:1; font-size:14px">Martwy ciąg</span>
          <span class="num" style="font-size:15px">180 kg × 3</span>
        </div>
      </div>
    </div>
  </div>

  <nav style="flex:0 0 64px; height:64px; background:var(--surface); border-top:1px solid var(--hairline); display:flex">
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--accent)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 19V11M9.5 19V5M15 19v-6M20.5 19V8"></path></svg>
      <span style="font:600 11px/1 'Public Sans',system-ui,sans-serif">Pulpit</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--ink-3)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"></path></svg>
      <span style="font:600 11px/1 'Public Sans',system-ui,sans-serif">Trening</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--ink-3)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9A9 9 0 1 1 3 12"></path><path d="M3 4v5h5M12 7.5V12l3 2"></path></svg>
      <span style="font:600 11px/1 'Public Sans',system-ui,sans-serif">Historia</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--ink-3)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3"></rect><path d="M8 9.5 12 13M8.5 7.2h7"></path></svg>
      <span style="font:600 11px/1 'Public Sans',system-ui,sans-serif">Waga</span>
    </div>
  </nav>
</div>
</x-dc>
<script data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
