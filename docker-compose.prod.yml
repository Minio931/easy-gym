# Wariant deployowy: baza jest zewnętrzna (Neon / Railway / RDS), w stosie
# zostają tylko API i PWA. Uruchamianie:
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Oba serwisy słuchają TYLKO na 127.0.0.1 -- TLS i publiczny port robi
# reverse proxy na hoście (Caddy/nginx/Traefik), patrz README.
name: easy-gym-prod

services:
  backend:
    build:
      context: ./backend
    image: easy-gym-backend:${IMAGE_TAG:-latest}
    restart: always
    environment:
      # Neon wymaga sslmode=require w URL-u JDBC, np.
      # jdbc:postgresql://ep-xxx.eu-central-1.aws.neon.tech/easy_gym?sslmode=require
      DB_URL: ${DB_URL:?ustaw DB_URL (JDBC do managed Postgresa)}
      DB_USERNAME: ${DB_USERNAME:?ustaw DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?ustaw DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?ustaw JWT_SECRET (min. 32 losowe bajty)}
      ADMIN_BOOTSTRAP_SECRET: ${ADMIN_BOOTSTRAP_SECRET:?ustaw ADMIN_BOOTSTRAP_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?ustaw publiczny adres frontu, np. https://easy-gym.example.com}
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?ustaw publiczny adres API, np. https://api.easy-gym.example.com}
    image: easy-gym-frontend:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
