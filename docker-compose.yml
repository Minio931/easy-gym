# Pełny stos do uruchomienia jedną komendą: Postgres + API + PWA.
# Wymaga pliku .env (patrz .env.example) -- sekrety są celowo BEZ domyślnych
# wartości, żeby nie dało się przypadkiem wystawić produkcji na dev-owym
# JWT_SECRET z application.yaml.
name: easy-gym

services:
  postgres:
    image: postgres:16-alpine
    container_name: easy-gym-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-easy_gym}
      POSTGRES_USER: ${POSTGRES_USER:-easy_gym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env}
    healthcheck:
      # Backend czeka na to, zanim spróbuje odpalić migracje Flyway --
      # "kontener wstał" to nie to samo co "baza przyjmuje połączenia".
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-easy_gym} -d ${POSTGRES_DB:-easy_gym}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - easy-gym-postgres-data:/var/lib/postgresql/data
    ports:
      # Wystawione tylko na localhost -- do psql/debugowania, nie dla świata.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  backend:
    build:
      context: ./backend
    image: easy-gym-backend:${IMAGE_TAG:-local}
    container_name: easy-gym-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-easy_gym}
      DB_USERNAME: ${POSTGRES_USER:-easy_gym}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env}
      JWT_SECRET: ${JWT_SECRET:?ustaw JWT_SECRET w .env (min. 32 losowe bajty)}
      ADMIN_BOOTSTRAP_SECRET: ${ADMIN_BOOTSTRAP_SECRET:?ustaw ADMIN_BOOTSTRAP_SECRET w .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SERVER_PORT: "8080"
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        # Adres API trafia do bundla w czasie BUILDU (NEXT_PUBLIC_*), więc
        # zmiana tej wartości wymaga `docker compose build frontend`.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    image: easy-gym-frontend:${IMAGE_TAG:-local}
    container_name: easy-gym-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  easy-gym-postgres-data:
